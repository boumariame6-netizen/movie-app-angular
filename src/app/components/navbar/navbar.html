<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <nav class="bg-dark-bg/80 backdrop-blur-md sticky top-0 z-50 py-4 border-b border-gray-800">
        <div class="container mx-auto flex justify-between items-center px-6">

            <div class="text-accent text-2xl font-black tracking-tighter uppercase">
                Ticket <span class="text-white">Zone</span>
            </div>

            <ul class="hidden md:flex space-x-8 text-sm font-medium uppercase tracking-widest text-soft-gray">
                <li class="hover:text-accent cursor-pointer transition text-white">Home</li>
                <li class="hover:text-accent cursor-pointer transition">Movies</li>
                <li class="hover:text-accent cursor-pointer transition">TV Shows</li>
                <li class="hover:text-accent cursor-pointer transition">Categories</li>
            </ul>

            <div class="flex items-center space-x-6">
                  
                <div class="relative hidden sm:block">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                        </svg>
                    </span>

                    <input type="text" placeholder="Search movies..."
                        class="bg-dark-card/50 border border-gray-800 text-sm rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-1 focus:ring-accent w-64 text-white transition-all duration-300 focus:w-80">
                </div>

                <div
                    class="w-10 h-10 rounded-full bg-accent flex items-center justify-center font-bold text-dark-bg cursor-pointer">
                    M
                </div>
            </div>

        </div>
    </nav>
</body>

</html>


<div class="bg-gray-900 rounded-xl overflow-hidden shadow-lg hover:scale-105 transition-transform duration-300 border border-gray-800">
  <img [src]="imgUrl" [alt]="title" class="w-full h-64 object-cover">
  
  <div class="p-4">
    <h3 class="text-white font-bold text-lg truncate">{{ title }}</h3>
    <div class="flex justify-between items-center mt-3">
      <span class="text-yellow-400 font-semibold">⭐ {{ rating }}</span>
      <button class="text-xs bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700">Watch</button>
    </div>
  </div>
</div>

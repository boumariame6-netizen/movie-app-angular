<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <nav class="bg-gray-900 text-white p-4 mb-8 shadow-md flex justify-between items-center px-10">
  <h1 class="text-2xl font-bold text-red-600">MY MOVIES</h1>
  <ul class="flex gap-6">
    <li class="hover:text-red-500 cursor-pointer">Home</li>
    <li class="hover:text-red-500 cursor-pointer">Series</li>
    <li class="hover:text-red-500 cursor-pointer">About</li>
  </ul>
</nav>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-5">
  @for (movie of movies(); track movie.id) {
<app-movie-card
 [title]="movie.title"
 [imgUrl]="movie.img"
 [rating]="movie.rating"

></app-movie-card>
  } @empty {
<li>There are no movie.</li>
}
</div>
</body>
</html>
